name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fingerprint database
        run: python3 -m stackscan validate
      - name: Python suite (offline fixtures)
        run: python3 -m unittest -v
      - name: Web engine suite (offline fixtures)
        run: node --test web/app.test.mjs
